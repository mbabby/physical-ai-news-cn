name: Daily physical AI digest

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "events/companies.json"
      - ".github/workflows/daily-digest.yml"
  schedule:
    # 提前探测：00:00 UTC = 北京时间 08:00。GitHub cron 可能排队，
    # 多个幂等触发点提高当天按时产出的概率；已有机器人日报时会立即跳过。
    - cron: "0 0 * * *"
    # 主任务：00:30 UTC = 北京时间 08:30
    - cron: "30 0 * * *"
    # 兜底任务：01:15 UTC = 北京时间 09:15。仅当主任务没有产出当天日报时运行。
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "回填窗口（首次初始化填 720；日更留空）"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

# 同一时间只允许一轮日报写入 main；避免手动触发与定时任务彼此抢占提交。
concurrency:
  group: daily-physical-ai-digest
  cancel-in-progress: false

jobs:
  generate:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main before generation
        # A queued manual/push run can start just after the preceding digest
        # commits the same daily file. Generate from that newest commit, not
        # from the older triggering SHA, so the later rebase cannot conflict
        # on daily/YYYY-MM-DD.{md,json}.
        run: git pull --ff-only origin main
      - name: Decide whether the fallback run is needed
        id: fallback
        shell: bash
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          # Every scheduled trigger is idempotent. The earliest trigger that
          # reaches a runner generates the digest; later delayed triggers skip.
          if [[ -z "${{ github.event.schedule }}" ]]; then
            exit 0
          fi
          digest_date="$(TZ=Asia/Shanghai date +%F)"
          if git log --format='%an' --since="${digest_date} 00:00:00 +0800" -- "daily/${digest_date}.md" | grep -qx "physical-ai-news-bot"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "A digest was already committed for ${digest_date}; this scheduled retry is skipped."
          fi
      - uses: actions/setup-node@v4
        if: steps.fallback.outputs.run == 'true'
        with:
          node-version: 24
      - run: corepack enable
        if: steps.fallback.outputs.run == 'true'
      - run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
        if: steps.fallback.outputs.run == 'true'
      - run: pnpm run check
        if: steps.fallback.outputs.run == 'true'
      - run: pnpm test
        if: steps.fallback.outputs.run == 'true'
      - run: pnpm start -- --hours "${DIGEST_HOURS:-24}"
        if: steps.fallback.outputs.run == 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          DIGEST_HOURS: ${{ inputs.hours }}
      - name: Validate generated publication
        if: steps.fallback.outputs.run == 'true'
        run: pnpm run validate:release
      - name: Report generator status
        id: generator_status
        if: steps.fallback.outputs.run == 'true'
        shell: bash
        run: |
          digest_date="$(TZ=Asia/Shanghai date +%F)"
          echo "digest_date=${digest_date}" >> "$GITHUB_OUTPUT"
          echo "## 日报生成状态 · ${digest_date}" >> "$GITHUB_STEP_SUMMARY"
          echo "### 信源" >> "$GITHUB_STEP_SUMMARY"
          jq -r '(.sourceOutcomes // []) | if map(select(.status == "failure")) | length == 0 then "- 成功：本轮已启用信源均完成抓取。" else map(select(.status == "failure") | "- 失败：\(.source)（\(.reason // "未知原因")）")[] end' "daily/${digest_date}.json" >> "$GITHUB_STEP_SUMMARY"
          echo "### LLM 与 OpenAlex" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.runtimeStatus[] | "- \(.component)：\(.status)；请求 \(.attempted)，成功 \(.succeeded)，失败 \(.failed)。\(.detail)"' "daily/${digest_date}.json" >> "$GITHUB_STEP_SUMMARY"
          echo "### 发布事务" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- 状态：\(.status)；公开产业 \(.quality.publicIndustryItems) 条，研究 \(.quality.publicResearchItems) 条，候选 \(.quality.candidates) 条，失败信源 \(.quality.sourceFailures) 个。"' review/run-manifest.json >> "$GITHUB_STEP_SUMMARY"
      - name: Commit updated digest
        id: commit_digest
        if: steps.fallback.outputs.run == 'true'
        shell: bash
        run: |
          # Dashboard data and Markdown are generated from the same digest.
          # Stage both before rebasing, otherwise Git refuses to rebase with
          # the dashboard JSON left unstaged and none of the refreshed pages
          # reach main.
          git add daily weekly sources review resources events research routes metrics site/data/dashboard.json FACTS_POLICY.md README.md README.en.md posts
          if ! git diff --cached --quiet; then
            git config user.name "physical-ai-news-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: update daily physical AI digest"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "status=已提交并推送" >> "$GITHUB_OUTPUT"
          else
            echo "status=无内容变化，无需提交" >> "$GITHUB_OUTPUT"
          fi
      - name: Report commit status
        if: always() && steps.fallback.outputs.run == 'true'
        shell: bash
        run: |
          echo "### 页面更新与提交" >> "$GITHUB_STEP_SUMMARY"
          echo "- 生成步骤：${{ steps.generator_status.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 提交步骤：${{ steps.commit_digest.outcome }} · ${{ steps.commit_digest.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 说明：日报由机器人提交时会显式派发 GitHub Pages 部署，避免 Actions 提交无法触发 push 工作流。" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispatch Pages deployment after bot commit
        id: pages_dispatch
        if: steps.fallback.outputs.run == 'true' && steps.commit_digest.outputs.status == '已提交并推送'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --request POST \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-pages.yml/dispatches" \
            --data '{"ref":"main"}'
          echo "status=已派发" >> "$GITHUB_OUTPUT"
      - name: Report Pages dispatch status
        if: always() && steps.fallback.outputs.run == 'true'
        shell: bash
        run: |
          echo "- Pages 部署派发：${{ steps.pages_dispatch.outcome }} · ${{ steps.pages_dispatch.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
