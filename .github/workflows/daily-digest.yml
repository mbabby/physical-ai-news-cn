name: Daily physical AI digest

on:
  schedule:
    # 00:30 UTC = 北京时间 08:30
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只允许一轮日报写入 main；避免手动触发与定时任务彼此抢占提交。
concurrency:
  group: daily-physical-ai-digest
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm start
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - name: Commit updated digest
        run: |
          git add daily weekly sources review resources events FACTS_POLICY.md README.md
          if ! git diff --cached --quiet; then
            git config user.name "physical-ai-news-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: update daily physical AI digest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
