name: Materialize community review issues

on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只预览任务生命周期动作，不修改 Issue"
        required: true
        type: boolean
        default: true
      limit:
        description: "本次最多创建的两分钟补证任务数（硬上限 5）"
        required: false
        default: "5"
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  ensure-labels:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure review lifecycle labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create evidence-review --repo "$REPO" --color "5319E7" --description "候选证据正在人工复核，不是公开事实" --force
          gh label create needs-evidence --repo "$REPO" --color "D4C5F9" --description "仍需补充一手来源或独立交叉证据" --force
          gh label create correction --repo "$REPO" --color "B60205" --description "当前公开 Watchlist 事实或判断需要人工纠错复核" --force
          gh label create accepted-evidence --repo "$REPO" --color "0E8A16" --description "证据已被维护者采纳；不代表自动发布" --force
          gh label create contributor-credited --repo "$REPO" --color "1D76DB" --description "贡献者已进入可追溯署名入口" --force
          gh label create source-evidence --repo "$REPO" --color "C5DEF5" --description "信源复核" --force
          gh label create company-evidence --repo "$REPO" --color "BFDADC" --description "公司、融资、产品或部署证据" --force
          gh label create research-evidence --repo "$REPO" --color "FBCA04" --description "论文与研究元数据证据" --force
          gh label create evidence-task --repo "$REPO" --color "5319E7" --description "由纯规划器生成的公开补证任务" --force
          gh label create two-minute-task --repo "$REPO" --color "1D76DB" --description "预计两分钟完成的单字段补证任务" --force
          gh label create evidence-task-company-funding --repo "$REPO" --color "BFDADC" --description "公司与融资证据任务" --force
          gh label create evidence-task-product-deployment --repo "$REPO" --color "C5DEF5" --description "产品与部署证据任务" --force
          gh label create evidence-task-research-metadata --repo "$REPO" --color "FBCA04" --description "研究元数据证据任务" --force
          gh label create stale --repo "$REPO" --color "D4C5F9" --description "七天无有效活动的补证任务" --force
          gh label create rejected-evidence --repo "$REPO" --color "B60205" --description "维护者已拒绝该证据" --force

  initialize-community-evidence:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    needs: ensure-labels
    runs-on: ubuntu-latest
    steps:
      - name: Put community submissions in the review layer
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ISSUE_TITLE" in
            "[信源]"*) category_label="source-evidence" ;;
            "[研究]"*) category_label="research-evidence" ;;
            "[公司/融资]"*|"[产品/部署]"*) category_label="company-evidence" ;;
            *) exit 0 ;;
          esac
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "evidence-review" --add-label "needs-evidence" --add-label "$category_label"

  materialize:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: ensure-labels
    concurrency:
      group: evidence-task-wip-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - name: Plan and apply weekly evidence task actions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          REQUESTED_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '5' }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f review/evidence-task-seeds.json
          test -f review/evidence-task-ledger.json
          [[ "$DRY_RUN" == "true" || "$DRY_RUN" == "false" ]] || { echo "dry_run 不合法" >&2; exit 1; }
          [[ "$REQUESTED_LIMIT" =~ ^[1-9][0-9]*$ ]] || { echo "limit 必须是正整数" >&2; exit 1; }
          if (( 10#$REQUESTED_LIMIT > 5 )); then
            REQUESTED_LIMIT=5
          fi

          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RAW_ISSUES="$RUNNER_TEMP/evidence-task-issues.ndjson"
          ENRICHED_ISSUES="$RUNNER_TEMP/evidence-task-issues-with-comments.ndjson"
          UNNORMALIZED_ISSUE_SNAPSHOT="$RUNNER_TEMP/evidence-task-issue-snapshot-unnormalized.json"
          ISSUE_SNAPSHOT="$RUNNER_TEMP/evidence-task-issue-snapshot.json"
          HARD_CAP_PLAN="$RUNNER_TEMP/evidence-task-hard-cap-plan.json"
          ACTION_PLAN="$RUNNER_TEMP/evidence-task-action-plan.json"
          : > "$RAW_ISSUES"
          : > "$ENRICHED_ISSUES"

          gh api --paginate "repos/$REPO/issues?labels=two-minute-task&state=all&per_page=100" --jq '.[] | select(has("pull_request") | not)' > "$RAW_ISSUES"
          while IFS= read -r issue; do
            number="$(jq -r '.number' <<< "$issue")"
            comments="$(gh api --paginate --slurp "repos/$REPO/issues/$number/comments?per_page=100" | jq -c 'add')"
            jq -cn --argjson issue "$issue" --argjson comments "$comments" '$issue + {comments: $comments}' >> "$ENRICHED_ISSUES"
          done < "$RAW_ISSUES"

          jq -s --arg fetchedAt "$NOW" --arg repo "$REPO" '
            def safe_labels:
              [.[].name | select(. == "accepted-evidence"
                or . == "canonical-promoted"
                or . == "contributor-credited"
                or . == "evidence-task"
                or . == "evidence-task-company-funding"
                or . == "evidence-task-product-deployment"
                or . == "evidence-task-research-metadata"
                or . == "rejected-evidence"
                or . == "source-withdrawn"
                or . == "stale"
                or . == "two-minute-task")] | unique;
            def task_id: capture("<!-- evidence-task-id:(?<id>evidence-task-[a-f0-9]{24}) -->").id;
            def task_version: capture("<!-- evidence-task-version:(?<version>[1-9][0-9]*) -->").version | tonumber;
            def evidence_urls:
              ([.body | scan("(?im)(?:^|\\n)\\s*(?:证据链接|evidence url)\\s*[：:]\\s*(https://[^\\s<>\\\"\\x27)\\]]+)") | .[0]]
                + [.comments[].body | scan("https://[^\\s<>\\\"\\x27)\\]]+")])
              | map(sub("[.,;:!?]+$"; "")) | unique | sort;
            {
              schemaVersion: 1,
              fetchedAt: $fetchedAt,
              repo: $repo,
              issues: [
                .[]
                | select(.body | test("<!-- evidence-task-id:evidence-task-[a-f0-9]{24} -->"))
                | {
                    number,
                    taskId: (.body | task_id),
                    taskVersion: (.body | task_version),
                    state,
                    labels: (.labels | safe_labels),
                    authorLogin: .user.login,
                    authorAssociation: .author_association,
                    createdAt: .created_at,
                    updatedAt: .updated_at,
                    closedAt: .closed_at,
                    evidenceUrls: evidence_urls,
                    acceptedContributors: [],
                    acceptedEvidence: []
                  }
              ] | sort_by(.number)
            }
          ' "$ENRICHED_ISSUES" > "$UNNORMALIZED_ISSUE_SNAPSHOT"

          node --input-type=module --eval '
            import { readFile, writeFile } from "node:fs/promises";
            const [inputPath, outputPath] = process.argv.slice(1);
            const snapshot = JSON.parse(await readFile(inputPath, "utf8"));
            for (const issue of snapshot.issues) {
              const normalized = issue.evidenceUrls.flatMap((candidate) => {
                try {
                  const url = new URL(candidate);
                  if (url.protocol !== "https:" || !url.hostname || url.username || url.password) return [];
                  url.hash = "";
                  return [url.toString()];
                } catch {
                  return [];
                }
              });
              issue.evidenceUrls = [...new Set(normalized)].sort();
            }
            await writeFile(outputPath, `${JSON.stringify(snapshot)}\n`, "utf8");
          ' "$UNNORMALIZED_ISSUE_SNAPSHOT" "$ISSUE_SNAPSHOT"

          pnpm exec tsx src/community-evidence/plan-issue-actions.ts \
            --seeds review/evidence-task-seeds.json \
            --issues "$ISSUE_SNAPSHOT" \
            --ledger review/evidence-task-ledger.json \
            --now "$NOW" \
            --out "$HARD_CAP_PLAN" \
            --wip-limit 5

          if [[ "$REQUESTED_LIMIT" == "5" ]]; then
            mv "$HARD_CAP_PLAN" "$ACTION_PLAN"
          else
            pnpm exec tsx src/community-evidence/plan-issue-actions.ts \
              --seeds review/evidence-task-seeds.json \
              --issues "$ISSUE_SNAPSHOT" \
              --ledger review/evidence-task-ledger.json \
              --now "$NOW" \
              --out "$ACTION_PLAN" \
              --wip-limit "$REQUESTED_LIMIT"
          fi

          jq -c '.actions[]' "$ACTION_PLAN" | while IFS= read -r planned_action; do
            if [[ "$DRY_RUN" == "true" ]]; then
              jq . <<< "$planned_action"
              continue
            fi
            action="$(jq -r '.action' <<< "$planned_action")"
            issue_number="$(jq -r '.issueNumber // empty' <<< "$planned_action")"
            case "$action" in
              create)
                task_id="$(jq -r '.taskId' <<< "$planned_action")"
                marker="<!-- evidence-task-id:${task_id} -->"
                existing="$(gh issue list --repo "$REPO" --state all --search "\"${marker}\" in:body" --json number --jq 'length')"
                if [[ "$existing" == "0" ]]; then
                  title="$(jq -r '.title' <<< "$planned_action")"
                  body="$(jq -r '.body' <<< "$planned_action")"
                  label_args=()
                  while IFS= read -r label; do label_args+=(--label "$label"); done < <(jq -r '.labels[]' <<< "$planned_action")
                  gh issue create --repo "$REPO" --title "$title" --body "$body" "${label_args[@]}"
                fi
                ;;
              mark-stale)
                if [[ "$(gh issue view "$issue_number" --repo "$REPO" --json state --jq '.state')" == "OPEN" ]]; then
                  gh issue edit "$issue_number" --repo "$REPO" --add-label "stale"
                fi
                ;;
              close)
                if [[ "$(gh issue view "$issue_number" --repo "$REPO" --json state --jq '.state')" == "OPEN" ]]; then
                  gh issue close "$issue_number" --repo "$REPO"
                fi
                ;;
              *)
                echo "未知规划动作：$action" >&2
                exit 1
                ;;
            esac
          done

  acknowledge-accepted-evidence:
    if: github.event_name == 'issues' && github.event.label.name == 'accepted-evidence'
    needs: ensure-labels
    runs-on: ubuntu-latest
    steps:
      - name: Credit the evidence contributor without auto-publishing the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create contributor-credited --repo "$REPO" --color "1D76DB" --description "贡献者已进入可追溯署名入口" --force
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "contributor-credited"
          if gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx "needs-evidence"; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "needs-evidence"
          fi
          marker="<!-- accepted-evidence-credit -->"
          existing="$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json comments --jq "[.comments[].body | contains(\"$marker\")] | any")"
          if [[ "$existing" != "true" ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$marker

          感谢 @$ISSUE_AUTHOR 补充可追溯证据。本 Issue 已标记为 \`accepted-evidence\`，贡献会出现在[证据贡献者入口](https://github.com/$REPO/issues?q=is%3Aissue+label%3Aaccepted-evidence)中。

          该标签只表示证据被采纳，不会把候选自动写入日报、公司档案或公开页面；accepted evidence requires canonical promotion in a later generation before any public artifact changes."
          fi
