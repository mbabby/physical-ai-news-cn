name: Publish weekly Top Signals

on:
  schedule:
    # W37 automatic publication: Thursday 13:00 UTC.
    - cron: "0 13 * * 4"
  workflow_dispatch:
    inputs:
      week:
        description: "Configured Top Signals ISO week (W36 requires exact approval)"
        required: true
        default: "2026-W36"
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-top-signals-release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --config.strict-dep-builds=false
      - run: pnpm run check
      - name: Run focused Top Signals release contracts
        run: pnpm exec tsx --test tests/top-signals-growth-workflow.test.ts tests/top-signals-growth-render.test.ts tests/decision-products-contracts.test.ts tests/release-contract.test.ts
      - name: Resolve configured week
        id: week
        shell: bash
        env:
          REQUESTED_WEEK: ${{ inputs.week }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            week="2026-W37"
          else
            week="$REQUESTED_WEEK"
          fi
          echo "week=$week" >> "$GITHUB_OUTPUT"
      - name: Prepare and gate canonical Release notes
        id: prepare
        shell: bash
        env:
          WEEK: ${{ steps.week.outputs.week }}
          PREPARE_DIR: ${{ runner.temp }}/top-signals-prepare
        run: |
          set -euo pipefail
          pnpm top-signals:prepare -- --week "$WEEK" --out "$PREPARE_DIR"
          echo "notes=$PREPARE_DIR/notes.md" >> "$GITHUB_OUTPUT"
      - name: Create or refresh canonical GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.week.outputs.week }}
          NOTES: ${{ steps.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          tag="top-signals-${WEEK}"
          title="Physical AI 资本与产品部署 Top Signals · ${WEEK}"
          notes="$NOTES"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes" --latest
            action="refreshed"
          else
            gh release create "$tag" --target main --title "$title" --notes-file "$notes" --latest
            action="created"
          fi
          release_url="$(gh release view "$tag" --json url --jq '.url')"
          echo "url=$release_url" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "### Release outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${action}: ${release_url}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish repository surfaces after Release success
        id: publish
        shell: bash
        env:
          WEEK: ${{ steps.week.outputs.week }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          pnpm top-signals:publish -- --week "$WEEK" --release-url "$RELEASE_URL"
          pnpm top-signals:validate -- --week "$WEEK"
          pnpm run validate:release
          git add weekly/top-signals review/top-signals-publication-receipt.json README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "### README outcome" >> "$GITHUB_STEP_SUMMARY"
            echo "- unchanged; canonical publication already materialized" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "physical-ai-news-bot"
          git config user.email "actions@github.com"
          git commit -m "chore: publish Top Signals ${WEEK}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "### README outcome" >> "$GITHUB_STEP_SUMMARY"
          echo "- updated after canonical Release confirmation" >> "$GITHUB_STEP_SUMMARY"
      - name: Report separate Release and README outcomes
        if: always()
        shell: bash
        run: |
          echo "## Release-first outcomes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release outcome: ${{ steps.release.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- README outcome: ${{ steps.publish.outcome }}" >> "$GITHUB_STEP_SUMMARY"
