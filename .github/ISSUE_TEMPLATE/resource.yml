name: 提交资讯源或常青资源
description: 推荐可靠的物理 AI 资讯源或长期资源
title: "[资源] "
labels: ["evidence-review", "needs-evidence", "resource"]
body:
  - type: dropdown
    id: type
    attributes:
      label: 内容类型
      options: [公司/融资/部署证据, 资讯源, 里程碑论文与精读, 模型与开源项目, 机器人与硬件, 仿真与工具, 数据集与基准, 学习资料与社区, 事实或路线纠错]
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 原始链接
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 中文事实说明、所属分类与收录/纠错理由
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: 候选层确认
      options:
        - label: 我理解常青资源需要长期价值审阅，不会因提交而自动进入正文。
          required: true
